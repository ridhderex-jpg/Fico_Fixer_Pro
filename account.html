<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account — FICO Fixer</title>
<style>
:root{--navy:#06264a;--blue:#00b7e8;--gold:#ffc51b;--ink:#0b2e56}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eff8fc}
header{background:#031b36;color:#fff;border-bottom:4px solid #087aa6;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:900}header span{color:#08bde8}
main{max-width:440px;margin:36px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:26px;box-shadow:0 6px 24px #0a2a4a1a}
h1{margin:0 0 14px;font-size:22px;color:var(--navy)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1px solid #b9d3e2;background:#f7fcff;border-radius:10px;font-weight:bold;cursor:pointer;color:var(--ink)}.tabs button.on{background:var(--navy);color:#fff}
label{display:block;font-size:12px;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid #b9d3e2;border-radius:10px;font:inherit;background:#f7fcff}
.btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:28px;background:var(--gold);color:#071c32;font-weight:900;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6}.link{background:none;border:0;color:#087aa6;cursor:pointer;font-size:12px;margin-top:10px;padding:0;text-decoration:underline}
#msg{margin-top:14px;font-size:13px;font-weight:bold;min-height:18px}.ok{color:#118a55}.err{color:#c0392b}
.hide{display:none}.btn.g{background:#fff;border:1px solid #b9d3e2;color:var(--ink);margin:0 0 4px}.or{text-align:center;font-size:12px;color:#789;margin:12px 0 0}.buy{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #dbe9f1}.buy button{background:var(--navy);color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:bold;cursor:pointer}
</style><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<header><a href="index.html">FICO <span>FIXER</span></a><a href="index.html">← Back to site</a></header>
<main><div class="card">

<div id="auth">
  <h1 id="title">Log in</h1>
  <div class="tabs"><button id="t-login" class="on" type="button">Log in</button><button id="t-signup" type="button">Sign up</button></div>
  <button class="btn g" id="google" type="button">Continue with Google</button><div class="or">or use your email</div><label for="email">Email</label><input id="email" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8">
  <button class="btn" id="go" type="button">Log in</button>
  <button class="link" id="forgot" type="button">Forgot password?</button> &nbsp; <button class="link" id="magic" type="button">Email me a login link</button>
</div>

<div id="reset" class="hide">
  <h1>Set a new password</h1>
  <label for="npw">New password</label><input id="npw" type="password" autocomplete="new-password" minlength="8">
  <button class="btn" id="save" type="button">Save password</button>
</div>

<div id="home" class="hide">
  <h1>My Account</h1>
  <p>Signed in as <b id="who"></b></p>
  <h3>My purchases</h3>
  <div id="buys" style="font-size:13px">Loading...</div>
  <button class="btn" id="out" type="button">Log out</button>
</div>

<div id="msg" role="status" aria-live="polite"></div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient("https://bzpgpdrdzwtipcsputxm.supabase.co","sb_publishable_rSL__j_d6pSU8B4fiWwucA_5T5PKRSW");
const $ = id => document.getElementById(id);
let mode = "login";
function say(t,c){ $("msg").textContent=t||""; $("msg").className=c||""; }
function view(v){ ["auth","reset","home"].forEach(x=>$(x).classList.toggle("hide",x!==v)); }
function setMode(m){ mode=m; $("t-login").classList.toggle("on",m==="login"); $("t-signup").classList.toggle("on",m==="signup");
  $("title").textContent=$("go").textContent=(m==="login"?"Log in":"Create account");
  $("pw").autocomplete=m==="login"?"current-password":"new-password"; say(); }
$("t-login").onclick=()=>setMode("login"); $("t-signup").onclick=()=>setMode("signup");

$("go").onclick = async () => {
  const email=$("email").value.trim(), password=$("pw").value;
  if(!email||password.length<8){ say("Enter your email and a password of at least 8 characters.","err"); return; }
  $("go").disabled=true; say("Please wait...");
  const r = mode==="login" ? await sb.auth.signInWithPassword({email,password})
    : await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/account.html"}});
  $("go").disabled=false;
  if(r.error){ say(r.error.message,"err"); return; }
  if(mode==="signup" && !r.data.session){ say("Check your email and click the confirmation link, then log in.","ok"); }
};
$("forgot").onclick = async () => {
  const email=$("email").value.trim();
  if(!email){ say("Type your email above first.","err"); return; }
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/account.html"});
  say(error?error.message:"If that email has an account, a reset link is on its way.",error?"err":"ok");
};
$("save").onclick = async () => {
  const {error}=await sb.auth.updateUser({password:$("npw").value});
  if(error){ say(error.message,"err"); return; }
  say("Password updated.","ok"); view("home");
};
$("google").onclick = async () => {
  const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/account.html"}});
  if(error) say(error.message,"err");
};
$("magic").onclick = async () => {
  const email=$("email").value.trim();
  if(!email){ say("Type your email above first.","err"); return; }
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+"/account.html"}});
  say(error?error.message:"Check your email for a login link.",error?"err":"ok");
};
$("out").onclick = async () => { await sb.auth.signOut(); say(); };


async function loadBuys(){
  const box=$("buys"); box.textContent="Loading...";
  const {data,error}=await sb.from("purchases").select("id, products(title,file_path,slug,kind)").order("created_at",{ascending:false});
  if(error){ box.textContent="Could not load your purchases."; return; }
  if(!data.length){ box.textContent="No purchases yet."; return; }
  box.textContent="";
  data.forEach(row=>{
    const d=document.createElement("div"); d.className="buy";
    const t=document.createElement("span"); t.textContent=row.products.title;
    if(row.products.kind==="course"){ const l=document.createElement("a"); l.textContent="Open Course"; l.href="course.html?slug="+encodeURIComponent(row.products.slug); l.style.cssText="background:#06264a;color:#fff;border-radius:20px;padding:8px 16px;font-weight:bold;text-decoration:none"; d.append(t,l); box.appendChild(d); return; }
    const b=document.createElement("button"); b.textContent="Download";
    b.onclick=async()=>{
      const {data:u,error:e}=await sb.storage.from("ebooks").createSignedUrl(row.products.file_path,60,{download:true});
      if(e){ say("Download failed. Please try again.","err"); return; }
      location.href=u.signedUrl;
    };
    d.append(t,b); box.appendChild(d);
  });
}
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){ view("reset"); return; }
  if(session){ $("who").textContent=session.user.email; view("home"); loadBuys(); } else { view("auth"); }
});
sb.auth.getSession().then(({data})=>{ if(!data.session) view("auth"); });
</script></body></html>
